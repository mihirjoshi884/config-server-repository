spring.application.name=BookingService
server.port=8087

# =========================================================================
# KUBERNETES POSTGRESQL CONFIGURATION (ISOLATED)
# =========================================================================
spring.datasource.url=jdbc:postgresql://postgres:5432/booking_service_db
spring.datasource.username=admin
spring.datasource.password=Mimioscar@030203
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================================
# OAUTH2 CLIENT REGISTRATION (Inter-service authentication)
# =========================================================================
oauth2.client.registration-key=client

spring.security.oauth2.client.registration.client.provider=OauthService
spring.security.oauth2.client.registration.client.client-id=obtb-client-007
spring.security.oauth2.client.registration.client.client-name=obtb-BookingService-client-007
spring.security.oauth2.client.registration.client.client-secret=obtb-BookingService-client-007
spring.security.oauth2.client.registration.client.authorization-grant-type=client_credentials

spring.security.oauth2.client.registration.client.scope[0]=openid
spring.security.oauth2.client.registration.client.scope[1]=profile
spring.security.oauth2.client.registration.client.scope[2]=internal

spring.security.oauth2.client.provider.OauthService.issuer-uri=${oauth.issuer-uri:http://obtb-auth-service:8081}
spring.security.oauth2.client.provider.OauthService.token-uri=${authservice.base-uri:http://obtb-auth-service:8081}/oauth2/token

# =========================================================================
# RESOURCE SERVER JWT VALIDATION
# =========================================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${oauth.issuer-uri:http://obtb-auth-service:8081}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${authservice.base-uri:http://obtb-auth-service:8081}/oauth2/jwks

# =========================================================================
# KUBERNETES KAFKA CONFIGURATION
# =========================================================================
spring.kafka.bootstrap-servers=kafka-broker:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer Configurations (Reading raw JSON strings)
spring.kafka.consumer.group-id=booking-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Orchestration Topics (Saga Flow)
kafka.topics[0].topic=booking-initiated-topic
kafka.topics[0].partitions=3
kafka.topics[0].replication=1

kafka.topics[1].topic=payment-events-topic
kafka.topics[1].partitions=3
kafka.topics[1].replication=1

