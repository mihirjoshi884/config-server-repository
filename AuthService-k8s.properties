spring.application.name=AuthService
server.port=8081

# =========================================================================
# OAUTH2 SERVER & RESOURCE SERVER CONFIGURATION
# =========================================================================
oauth-client-clientId=obtb-client-002
oauth-client-clientSecret=obtb-auth-clientSecret

# FIXED: Logical security issuer must match what the external browser expects (localhost:8081 or via Gateway)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${oauth.issuer-uri:http://localhost:8081}

# The public keys (JWKS endpoint) can be looked up locally or via internal URI
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${authservice.base-uri:http://localhost:8081}/oauth2/jwks

# =========================================================================
# DOCKER CONTAINERIZED POSTGRESQL CONFIGURATION
# =========================================================================
# FIXED: Diverted from cloud Neon Tech to the shared internal 'postgres_db' container
spring.datasource.url=jdbc:postgresql://postgres_db:5432/oauth_service_db
spring.datasource.username=admin
spring.datasource.password=Mimioscar@030203
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================================
# DOCKER CONTAINERIZED KAFKA CONFIGURATION
# =========================================================================
# FIXED: Diverted from external cloud Aiven proxy to internal container name
spring.kafka.bootstrap-servers=kafka:9092

# Removed cloud SSL overhead as traffic stays within the private 'obtb-network' bridge
spring.kafka.admin.auto-create=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=oauth-service-producer-group

# Core Kafka Topics Metadata Orchestration
kafka.topics[0].topic=user-created 
kafka.topics[0].partitions=3
kafka.topics[0].replication=1
kafka.topics[1].topic=producer_oauth.urgent.account_recovery
kafka.topics[1].partitions=3
kafka.topics[1].replication=1
kafka.topics[2].topic=producer_oauth.urgent.password_change
kafka.topics[2].partitions=3
kafka.topics[2].replication=1

logging.level.org.apache.kafka=DEBUG
spring.main.allow-circular-references=true

