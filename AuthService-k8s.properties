spring.application.name=AuthService
server.port=8081

# =========================================================================
# OAUTH2 SERVER & RESOURCE SERVER CONFIGURATION
# =========================================================================
oauth-client-clientId=obtb-client-002
oauth-client-clientSecret=obtb-auth-clientSecret

spring.security.oauth2.resourceserver.jwt.issuer-uri=${oauth.issuer-uri:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${authservice.base-uri:http://obtb-auth-service:8081}/oauth2/jwks

# =========================================================================
# KUBERNETES POSTGRESQL CONFIGURATION
# =========================================================================
spring.datasource.url=jdbc:postgresql://postgres:5432/oauth_service_db
spring.datasource.username=admin
spring.datasource.password=Mimioscar@030203
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================================
# KUBERNETES KAFKA CONFIGURATION
# =========================================================================
spring.kafka.bootstrap-servers=kafka-broker:9092

spring.kafka.admin.auto-create=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=oauth-service-producer-group

# Core Kafka Topics Metadata Orchestration
kafka.topics[0].topic=user-created
kafka.topics[0].partitions=3
kafka.topics[0].replication=1

kafka.topics[1].topic=producer_oauth.urgent.account_recovery
kafka.topics[1].partitions=3
kafka.topics[1].replication=1

kafka.topics[2].topic=producer_oauth.urgent.password_change
kafka.topics[2].partitions=3
kafka.topics[2].replication=1

logging.level.org.apache.kafka=DEBUG
spring.main.allow-circular-references=true

