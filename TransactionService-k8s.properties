spring.application.name=TransactionService
server.port=8085

# =========================================================================
# KUBERNETES POSTGRESQL CONFIGURATION (ISOLATED)
# =========================================================================
spring.datasource.url=jdbc:postgresql://postgres:5432/transaction_service_db
spring.datasource.username=admin
spring.datasource.password=Mimioscar@030203
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================================
# OAUTH2 CLIENT REGISTRATION (Inter-service authentication)
# =========================================================================
oauth2.client.registration-key=client

spring.security.oauth2.client.registration.client.provider=OauthService
spring.security.oauth2.client.registration.client.client-id=obtb-client-005
spring.security.oauth2.client.registration.client.client-name=obtb-transaction-service-client-005
spring.security.oauth2.client.registration.client.client-secret=obtb-transaction-service-client-005
spring.security.oauth2.client.registration.client.authorization-grant-type=client_credentials

spring.security.oauth2.client.registration.client.scope[0]=openid
spring.security.oauth2.client.registration.client.scope[1]=profile

spring.security.oauth2.client.provider.OauthService.issuer-uri=${oauth.issuer-uri:http://obtb-auth-service:8081}

spring.security.oauth2.client.provider.OauthService.token-uri=${authservice.base-uri:http://obtb-auth-service:8081}/oauth2/token


# =========================================================================
# RESOURCE SERVER JWT VALIDATION
# =========================================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${oauth.issuer-uri:http://obtb-auth-service:8081}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${authservice.base-uri:http://obtb-auth-service:8081}/oauth2/jwks
